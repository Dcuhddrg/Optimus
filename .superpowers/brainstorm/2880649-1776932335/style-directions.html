<style>
  :root {
    --bg: #09111b;
    --card: rgba(15, 24, 38, 0.9);
    --line: rgba(255,255,255,0.08);
    --text: #f5f7fb;
    --muted: #94a2b8;
    --cyan: #6bddff;
    --green: #74f0ba;
    --amber: #ffc76e;
    --rose: #ff9494;
    --blue: #4d7dff;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)), var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    overflow: hidden;
  }

  .card-body {
    padding: 18px 20px 22px;
  }

  .preview {
    aspect-ratio: 4 / 4.5;
    padding: 16px;
  }

  .mock {
    height: 100%;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
  }

  .shell {
    display: grid;
    grid-template-columns: 74px 1fr;
    height: 100%;
  }

  .side {
    border-right: 1px solid rgba(255,255,255,0.08);
    padding: 12px 10px;
    display: grid;
    align-content: start;
    gap: 10px;
  }

  .side-dot {
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
  }

  .main {
    padding: 14px;
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 12px;
  }

  .bar, .metric, .list-item, .panel-block {
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .bar {
    height: 48px;
    background: rgba(255,255,255,0.03);
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .metric {
    min-height: 74px;
  }

  .content-grid {
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    gap: 10px;
  }

  .panel-block {
    padding: 10px;
    display: grid;
    gap: 8px;
  }

  .list-item {
    min-height: 44px;
    background: rgba(255,255,255,0.03);
  }

  .tone-1 .mock {
    background:
      radial-gradient(circle at top left, rgba(107,221,255,0.14), transparent 35%),
      linear-gradient(180deg, #0a1422, #0d1725);
  }

  .tone-1 .side {
    background: rgba(255,255,255,0.025);
  }

  .tone-1 .metric:nth-child(1) { background: linear-gradient(180deg, rgba(107,221,255,0.12), rgba(107,221,255,0.04)); }
  .tone-1 .metric:nth-child(2) { background: linear-gradient(180deg, rgba(116,240,186,0.1), rgba(116,240,186,0.03)); }
  .tone-1 .metric:nth-child(3) { background: linear-gradient(180deg, rgba(255,199,110,0.1), rgba(255,199,110,0.03)); }

  .tone-2 .mock {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.3)),
      #f1f5fb;
    color: #14202e;
  }

  .tone-2 .side {
    background: rgba(12, 28, 52, 0.04);
    border-right-color: rgba(11, 21, 40, 0.08);
  }

  .tone-2 .side-dot { background: rgba(11, 21, 40, 0.18); }
  .tone-2 .bar,
  .tone-2 .metric,
  .tone-2 .list-item,
  .tone-2 .panel-block {
    background: rgba(255,255,255,0.72);
    border-color: rgba(10,20,34,0.06);
  }

  .tone-3 .mock {
    background:
      radial-gradient(circle at top right, rgba(255,199,110,0.12), transparent 28%),
      radial-gradient(circle at bottom left, rgba(107,221,255,0.12), transparent 26%),
      linear-gradient(180deg, #0b1017, #131b26);
  }

  .tone-3 .side {
    background: rgba(255,255,255,0.035);
  }

  .tone-3 .metric,
  .tone-3 .panel-block {
    background: rgba(255,255,255,0.045);
  }

  .tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .tag {
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 11px;
    color: var(--muted);
  }
</style>

<h2>整体气质方向对比</h2>
<p class="subtitle">结构会参考 gin-vue-admin 的后台组织方式，但视觉语言单独设计。请选一个最接近你想要的气质。</p>

<div class="cards">
  <div class="card" data-choice="dark-saas" onclick="toggleSelect(this)">
    <div class="preview tone-1">
      <div class="mock">

            </div>
          </div>
        </div>
      </div>
    </div>

      <div class="tags"><span class="tag">专业</span><span class="tag">稳重</span><span class="tag">最易落地</span></div>
    </div>
  </div>

  <div class="card" data-choice="light-premium" onclick="toggleSelect(this)">
    <div class="preview tone-2">
      <div class="mock">
        <div class="shell">
          <div class="side">
            <div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div>

            <div class="metrics"><div class="metric"></div><div class="metric"></div><div class="metric"></div></div>

              <div class="panel-block"><div class="list-item"></div><div class="list-item"></div><div class="list-item"></div></div>
              <div class="panel-block"><div class="list-item"></div><div class="list-item"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 浅色高级产品化</h3>
      <p>更像高端 SaaS 平台。更轻、更精致，管理感更强，传统运维味道会弱一点。</p>
      <div class="tags"><span class="tag">高级感</span><span class="tag">精致</span><span class="tag">轻盈</span></div>
    </div>
  </div>

  <div class="card" data-choice="dark-editorial" onclick="toggleSelect(this)">
    <div class="preview tone-3">
      <div class="mock">
        <div class="shell">
          <div class="side">
            <div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div>
          </div>
          <div class="main">
            <div class="bar"></div>
            <div class="metrics"><div class="metric"></div><div class="metric"></div><div class="metric"></div></div>
            <div class="content-grid">
              <div class="panel-block"><div class="list-item"></div><div class="list-item"></div><div class="list-item"></div></div>
              <div class="panel-block"><div class="list-item"></div><div class="list-item"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 深色编辑部式控制台</h3>
      <p>保留运维控制台骨架，但气质更独特，带一点品牌化和内容设计感。</p>
      <div class="tags"><span class="tag">更特别</span><span class="tag">品牌感</span><span class="tag">辨识度高</span></div>
    </div>
  </div>
</div>
