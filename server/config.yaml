system:
  env: develop
  addr: 8888
  db-type: mysql
  router-prefix: /api/v1
  admin-initial-password: admin
zap:
  level: info
  format: console
  prefix: optimus
mysql:
  path: 127.0.0.1
  port: 3306
  db-name: optimus
  username: root
  password: ""
  config: charset=utf8mb4&parseTime=True&loc=Local
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: info
  log-zap: false
  prefix: ""
  singular: false
jwt:
  signing-key: optimus
  expires-time: 7d
  buffer-time: 1d
  issuer: optimus
cloud:
  credential-encryption-key: ""   # Must be exactly 32 ASCII characters in production
