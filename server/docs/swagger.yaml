definitions:
  request.AddMemberRequest:
    properties:
      projectRole:
        type: string
      userId:
        type: integer
    type: object
  request.CreateAccountRequest:
    properties:
      accountId:
        type: string
      credential:
        additionalProperties:
          type: string
        type: object
      credentialType:
        type: string
      name:
        type: string
      provider:
        type: string
      tags:
        additionalProperties:
          type: string
        type: object
    required:
    - accountId
    - credential
    - credentialType
    - name
    - provider
    type: object
  request.CreateProjectRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  request.LDAPConfigRequest:
    properties:
      baseDn:
        type: string
      bindDn:
        type: string
      bindPassword:
        type: string
      departmentAttr:
        description: DepartmentAttr nil keeps the saved value; "" stops syncing departments.
        type: string
      displayNameAttr:
        type: string
      emailAttr:
        type: string
      employeeTypeAttr:
        description: EmployeeTypeAttr "" keeps the saved value (employeeType by default).
        type: string
      enabled:
        type: boolean
      externalTypeValues:
        description: |-
          ExternalTypeValues nil keeps the saved list; an empty list means
          nobody is external.
        items:
          type: string
        type: array
      idAttr:
        type: string
      url:
        type: string
      userFilter:
        type: string
      usernameAttr:
        type: string
    type: object
  request.LDAPSyncExecuteRequest:
    properties:
      bind:
        items:
          type: integer
        type: array
      disable:
        items:
          type: integer
        type: array
      previewId:
        type: string
      separate:
        items:
          type: integer
        type: array
    required:
    - previewId
    type: object
  request.LDAPTestRequest:
    properties:
      baseDn:
        type: string
      bindDn:
        type: string
      bindPassword:
        type: string
      departmentAttr:
        type: string
      displayNameAttr:
        type: string
      emailAttr:
        type: string
      idAttr:
        type: string
      url:
        type: string
      useSavedBindPassword:
        type: boolean
      userFilter:
        type: string
      usernameAttr:
        type: string
    type: object
  request.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  request.RoleRequest:
    properties:
      approvable:
        description: 'Approvable: nil keeps the current flag on update, false on create.'
        type: boolean
      code:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  request.UpdateAccountRequest:
    properties:
      credential:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
    type: object
  request.UpdateAccountTagsRequest:
    properties:
      tags:
        additionalProperties:
          type: string
        type: object
    required:
    - tags
    type: object
  request.UpdateMemberRoleRequest:
    properties:
      projectRole:
        type: string
    type: object
  request.UpdateProjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  request.UpdateRolePermissionsRequest:
    properties:
      permissionCodes:
        items:
          type: string
        type: array
    type: object
  request.UpdateUserExternalRequest:
    properties:
      expiresOn:
        type: string
      sponsorId:
        type: integer
    type: object
  request.UpdateUserRequest:
    properties:
      displayName:
        type: string
      email:
        type: string
    type: object
  request.UpdateUserRolesRequest:
    properties:
      roleIds:
        items:
          type: integer
        type: array
    type: object
  request.UpdateUserStatusRequest:
    properties:
      status:
        type: string
    type: object
  response.AccountView:
    properties:
      accountId:
        type: string
      credential:
        type: string
      credentialType:
        type: string
      id:
        type: integer
      lastSyncedAt:
        type: string
      name:
        type: string
      projectId:
        type: integer
      provider:
        type: string
      status:
        type: string
      tags:
        additionalProperties:
          type: string
        type: object
    type: object
  response.AssetView:
    properties:
      accountId:
        type: integer
      configJson:
        type: string
      deletedAt:
        type: string
      discoveredAt:
        type: string
      id:
        type: integer
      lastSeenAt:
        type: string
      name:
        type: string
      provider:
        type: string
      region:
        type: string
      resourceId:
        type: string
      resourceType:
        type: string
      status:
        type: string
      tagsJson:
        type: string
    type: object
  response.AuditListData:
    properties:
      list:
        items:
          $ref: '#/definitions/system.AuditLogEntry'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  response.CurrentUserResult:
    properties:
      menuPermissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/response.SystemUserSummary'
    type: object
  response.HealthResponse:
    properties:
      status:
        type: string
    type: object
  response.LDAPConfigResult:
    properties:
      baseDn:
        type: string
      bindDn:
        type: string
      bindPassword:
        type: string
      boundUsers:
        description: |-
          BoundUsers counts accounts bound to a directory identity; while it is
          non-zero, IDAttr cannot change.
        type: integer
      departmentAttr:
        type: string
      displayNameAttr:
        type: string
      emailAttr:
        type: string
      employeeTypeAttr:
        type: string
      enabled:
        type: boolean
      externalTypeValues:
        items:
          type: string
        type: array
      hasBindPassword:
        type: boolean
      idAttr:
        type: string
      url:
        type: string
      userFilter:
        type: string
      usernameAttr:
        type: string
    type: object
  response.LDAPSyncAccount:
    properties:
      createdAt:
        type: string
      department:
        type: string
      displayName:
        type: string
      email:
        type: string
      externalId:
        type: string
      id:
        type: integer
      roles:
        items:
          type: string
        type: array
      status:
        type: string
      username:
        type: string
    type: object
  response.LDAPSyncEntry:
    properties:
      createdAt:
        type: string
      department:
        type: string
      displayName:
        type: string
      dn:
        type: string
      email:
        type: string
      externalId:
        type: string
      username:
        type: string
    type: object
  response.LDAPSyncFieldChange:
    properties:
      after:
        type: string
      before:
        type: string
      field:
        type: string
    type: object
  response.LDAPSyncItem:
    properties:
      account:
        $ref: '#/definitions/response.LDAPSyncAccount'
      category:
        type: string
      changes:
        items:
          $ref: '#/definitions/response.LDAPSyncFieldChange'
        type: array
      entry:
        $ref: '#/definitions/response.LDAPSyncEntry'
      ownedProjects:
        items:
          type: string
        type: array
      reason:
        type: string
      restrictedRoles:
        description: |-
          RestrictedRoles and OwnedProjects are set when an update turns an
          employee into an external person: those roles stop applying at once;
          the admin should remove them and hand the projects to an employee.
        items:
          type: string
        type: array
      suspicious:
        type: boolean
    type: object
  response.LDAPSyncOutcome:
    properties:
      accountId:
        type: integer
      action:
        type: string
      outcome:
        type: string
      reason:
        type: string
      username:
        type: string
    type: object
  response.LDAPSyncPreview:
    properties:
      configChanged:
        description: |-
          ConfigChanged: base DN, filter or identity attribute changed since the
          last successful sync, so every disable candidate needs the admin.
        type: boolean
      disablesBlocked:
        description: |-
          DisablesBlocked: some entries could not be identified, so this sync
          disables nobody.
        type: boolean
      expiresAt:
        type: string
      items:
        items:
          $ref: '#/definitions/response.LDAPSyncItem'
        type: array
      previewId:
        type: string
    type: object
  response.LDAPSyncResult:
    properties:
      outcomes:
        items:
          $ref: '#/definitions/response.LDAPSyncOutcome'
        type: array
      status:
        type: string
    type: object
  response.LDAPTestResult:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  response.LoginResult:
    properties:
      menuPermissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      token:
        type: string
      user:
        $ref: '#/definitions/response.SystemUserSummary'
    type: object
  response.PageResult-response_AssetView:
    properties:
      list:
        items:
          $ref: '#/definitions/response.AssetView'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  response.PingResponse:
    properties:
      message:
        type: string
    type: object
  response.ProjectMember:
    properties:
      displayName:
        type: string
      projectRole:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  response.ProjectView:
    properties:
      code:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      ownerId:
        type: integer
      status:
        type: string
      updatedAt:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  response.RoleListItem:
    properties:
      approvable:
        description: |-
          Approvable marks a role usable as an approval level (design 3.5). As in
          GVA, roles have no enabled/disabled status.
        type: boolean
      code:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      permissionCodes:
        items:
          type: string
        type: array
      updatedAt:
        type: string
    type: object
  response.SyncResult:
    properties:
      errors:
        type: integer
      upserted:
        type: integer
    type: object
  response.SystemUserSummary:
    properties:
      bound:
        type: boolean
      department:
        type: string
      displayName:
        type: string
      email:
        type: string
      expiresOn:
        type: string
      id:
        type: integer
      personType:
        description: |-
          PersonType is employee or external. ExpiresOn (YYYY-MM-DD, the last
          valid day) and SponsorID apply to external accounts only.
        type: string
      source:
        type: string
      sponsorId:
        type: integer
      status:
        type: string
      username:
        type: string
      uuid:
        type: string
    type: object
  response.UserListItem:
    properties:
      bound:
        type: boolean
      department:
        type: string
      displayName:
        type: string
      email:
        type: string
      expired:
        type: boolean
      expiresOn:
        type: string
      id:
        type: integer
      personType:
        description: |-
          PersonType is employee or external. ExpiresOn (YYYY-MM-DD, the last
          valid day) and SponsorID apply to external accounts only.
        type: string
      roles:
        items:
          type: string
        type: array
      source:
        type: string
      sponsor:
        description: |-
          Sponsor is the sponsor's username; SponsorInvalid is set when the
          sponsor no longer exists, is disabled or is not an employee. Expired
          is set when an external account is past its expiry.
        type: string
      sponsorId:
        type: integer
      sponsorInvalid:
        type: boolean
      status:
        type: string
      username:
        type: string
      uuid:
        type: string
    type: object
  system.AuditLogEntry:
    properties:
      action:
        type: string
      actorUserId:
        type: integer
      actorUsername:
        type: string
      createdAt:
        type: string
      detail:
        type: string
      id:
        type: integer
      ip:
        type: string
      resourceId:
        type: string
      resourceType:
        type: string
      result:
        type: string
      userAgent:
        type: string
    type: object
  system.SystemPermission:
    properties:
      code:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      method:
        type: string
      name:
        type: string
      parentCode:
        type: string
      path:
        type: string
      sort:
        type: integer
      type:
        type: string
      updatedAt:
        type: string
    type: object
  system.SystemRole:
    properties:
      approvable:
        description: |-
          Approvable marks a role usable as an approval level (design 3.5). As in
          GVA, roles have no enabled/disabled status.
        type: boolean
      code:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    type: object
info:
  contact: {}
  description: Optimus 运维平台后端接口。业务结果均为 HTTP 200 + {code,data,msg}（code 0 成功、7 失败），仅未认证返回
    HTTP 401。
  title: Optimus Swagger API 接口文档
  version: v1
paths:
  /base/ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PingResponse'
      summary: 存活探针
      tags:
      - Base
  /cloud/accounts:
    get:
      parameters:
      - description: 当前项目编码；为空时按可访问项目范围
        in: header
        name: X-Project-Code
        type: string
      - collectionFormat: multi
        description: 标签筛选，key=value 或 __none__:key，可重复
        in: query
        items:
          type: string
        name: tag
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/response.AccountView'
                      type: array
                  type: object
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 云账号列表（不分页，支持标签筛选）
      tags:
      - CloudAccount
    post:
      consumes:
      - application/json
      parameters:
      - description: 当前项目编码，创建时必填
        in: header
        name: X-Project-Code
        required: true
        type: string
      - description: 请求体
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.AccountView'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 在当前项目下创建云账号
      tags:
      - CloudAccount
  /cloud/accounts/{id}:
    delete:
      parameters:
      - description: 当前项目编码；为空时按可访问项目范围
        in: header
        name: X-Project-Code
        type: string
      - description: 云账号 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除云账号
      tags:
      - CloudAccount
    get:
      parameters:
      - description: 当前项目编码；为空时按可访问项目范围
        in: header
        name: X-Project-Code
        type: string
      - description: 云账号 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.AccountView'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取云账号
      tags:
      - CloudAccount
    put:
      consumes:
      - application/json
      parameters:
      - description: 当前项目编码；为空时按可访问项目范围
        in: header
        name: X-Project-Code
        type: string
      - description: 云账号 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 请求体
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.AccountView'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 更新云账号
      tags:
      - CloudAccount
  /cloud/accounts/{id}/sync:
    post:
      parameters:
      - description: 当前项目编码；为空时按可访问项目范围
        in: header
        name: X-Project-Code
        type: string
      - description: 云账号 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.SyncResult'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 同步云账号下的资产
      tags:
      - CloudAccount
  /cloud/accounts/{id}/tags:
    put:
      consumes:
      - application/json
      parameters:
      - description: 当前项目编码；为空时按可访问项目范围
        in: header
        name: X-Project-Code
        type: string
      - description: 云账号 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 请求体
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.UpdateAccountTagsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.AccountView'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 替换云账号标签
      tags:
      - CloudAccount
  /cloud/assets:
    get:
      parameters:
      - description: 当前项目编码；为空时按可访问项目范围
        in: header
        name: X-Project-Code
        type: string
      - default: 1
        description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数，1～200
        in: query
        name: pageSize
        type: integer
      - description: 云账号 ID
        in: query
        name: accountId
        type: integer
      - description: 云厂商
        in: query
        name: provider
        type: string
      - description: 地域
        in: query
        name: region
        type: string
      - description: 资源类型
        in: query
        name: resourceType
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 关键字
        in: query
        name: keyword
        type: string
      - collectionFormat: multi
        description: 标签筛选，key=value，可重复
        in: query
        items:
          type: string
        name: tag
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PageResult-response_AssetView'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 分页查询云资产
      tags:
      - CloudAsset
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.HealthResponse'
      summary: 健康检查：数据库或启动数据初始化失败时返回 503
      tags:
      - Base
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PingResponse'
      summary: 存活探针
      tags:
      - Base
  /projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/response.ProjectView'
                      type: array
                  type: object
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 当前用户可访问的项目列表
      tags:
      - Project
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
