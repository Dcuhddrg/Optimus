          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建项目
      tags:
      - Project
  /projects/{code}:
    delete:
      parameters:
      - description: 项目编码
        in: path
        name: code
        required: true
        type: string
      produces:
