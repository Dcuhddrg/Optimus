        required: true
        schema:
          $ref: '#/definitions/request.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code 0 成功，code 7 业务失败
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.ProjectView'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 更新项目
      tags:
      - Project
  /projects/{code}/members:
    get:
      parameters:
      - description: 项目编码
        in: path
