          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除项目
      tags:
      - Project
    get:
      parameters:
      - description: 项目编码
        in: path
        name: code
        required: true
